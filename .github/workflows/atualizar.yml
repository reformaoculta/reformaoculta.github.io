# Atualiza a lista de vídeos do canal todo dia e quando houver alteração no app.
name: Atualizar vídeos do canal

on:
  schedule:
    - cron: "15 9,21 * * *"   # 06:15 e 18:15 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar yt-dlp
        run: pip install -U yt-dlp
      - name: Baixar listas do canal
        env:
          CANAL: https://www.youtube.com/channel/UCXF-4pobMGoKSlgOB3P28Zw
        run: |
          mkdir -p .listas
          for t in videos shorts; do
            yt-dlp --extractor-args "youtube:lang=pt" --flat-playlist --dump-single-json "$CANAL/$t" > .listas/$t.json || rm -f .listas/$t.json
            yt-dlp --extractor-args "youtube:lang=en" --flat-playlist --dump-single-json "$CANAL/$t" > .listas/${t}_en.json || rm -f .listas/${t}_en.json
          done
          # arquivo vazio = falhou: apaga para o gerador usar o plano B (feed público)
          find .listas -name "*.json" -size -100c -delete
          curl -sL "https://www.youtube.com/feeds/videos.xml?channel_id=UCXF-4pobMGoKSlgOB3P28Zw" -o .listas/feed.xml
      - name: Gerar catálogo
        run: |
          python ferramentas/gerar_dados.py .listas dados/videos.json
          # segurança: não publica se a lista vier vazia (YouTube fora do ar, bloqueio etc.)
          python -c "import json,sys; d=json.load(open('dados/videos.json',encoding='utf-8')); sys.exit(0 if len(d['videos'])>100 else 1)"
      - name: Salvar se mudou
        run: |
          git config user.name "atualizador"
          git config user.email "actions@users.noreply.github.com"
          git add dados/videos.json
          git diff --cached --quiet || (git commit -m "Atualiza lista de vídeos" && git push)
