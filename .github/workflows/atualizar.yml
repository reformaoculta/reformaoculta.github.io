# Atualiza a lista de vídeos do canal e avisa quem ligou os avisos quando sai vídeo novo.
# - Toda hora: confere o feed público do canal (leve) para pegar vídeo novo rápido.
# - 06:15 e 18:15 (Brasília) ou quando rodado à mão: baixa a lista completa (títulos, visualizações).
name: Atualizar vídeos do canal

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Mandar um aviso de teste com o vídeo mais recente"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guardar a lista de antes
        run: |
          python -c "import json; d=json.load(open('dados/videos.json',encoding='utf-8')); print('\n'.join(v['id'] for v in d['videos']+d['shorts']))" > /tmp/ids_antes.txt
          cp dados/videos.json /tmp/antes.json
      - name: Baixar listas do canal
        env:
          CANAL: https://www.youtube.com/channel/UCXF-4pobMGoKSlgOB3P28Zw
        run: |
          mkdir -p .listas
          HORA=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HORA" = "09" ] || [ "$HORA" = "21" ]; then
            pip install -q -U yt-dlp
            for t in videos shorts; do
              yt-dlp --extractor-args "youtube:lang=pt" --flat-playlist --dump-single-json "$CANAL/$t" > .listas/$t.json || rm -f .listas/$t.json
              yt-dlp --extractor-args "youtube:lang=en" --flat-playlist --dump-single-json "$CANAL/$t" > .listas/${t}_en.json || rm -f .listas/${t}_en.json
            done
            # arquivo vazio = falhou: apaga para o gerador usar o plano B (feed público)
            find .listas -name "*.json" -size -100c -delete
          fi
          curl -sL "https://www.youtube.com/feeds/videos.xml?channel_id=UCXF-4pobMGoKSlgOB3P28Zw" -o .listas/feed.xml
      - name: Gerar catálogo
        run: |
          python ferramentas/gerar_dados.py .listas dados/videos.json
          python ferramentas/gerar_paginas.py
          # segurança: não publica se a lista vier vazia (YouTube fora do ar, bloqueio etc.)
          python -c "import json,sys; d=json.load(open('dados/videos.json',encoding='utf-8')); sys.exit(0 if len(d['videos'])>100 else 1)"
      - name: Salvar se mudou
        run: |
          # se só o horário da atualização mudou, volta o arquivo antigo (evita gravar toda hora à toa)
          python -c "import json,shutil; c=lambda f:{k:v for k,v in json.load(open(f,encoding='utf-8')).items() if k!='atualizado'}; c('/tmp/antes.json')==c('dados/videos.json') and shutil.copy('/tmp/antes.json','dados/videos.json')"
          git config user.name "atualizador"
          git config user.email "actions@users.noreply.github.com"
          git add dados/videos.json sitemap.xml */index.html
          git diff --cached --quiet || (git commit -m "Atualiza lista de vídeos" && git push)
      - name: Avisar vídeo novo
        env:
          ONESIGNAL_APP_ID: "2ca45beb-167c-47e7-baa2-6c55843ecc17"
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python ferramentas/avisar.py /tmp/ids_antes.txt dados/videos.json ${{ inputs.teste && '--teste' || '' }}
